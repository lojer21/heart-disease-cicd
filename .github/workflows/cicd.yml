name: Heart Disease Prediction — CI/CD Pipeline

# ───────────────────────────────────────────────────────────────
# TRIGGER: Runs on every push or pull request to main branch
# ───────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# ───────────────────────────────────────────────────────────────
# ENVIRONMENT VARIABLES
# ───────────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.10"

# ───────────────────────────────────────────────────────────────
# JOBS
# ───────────────────────────────────────────────────────────────
jobs:

  # ─────────────────────────────────────────────────────────────
  # JOB 1: CI — Code Quality, Tests, and Model Validation
  # ─────────────────────────────────────────────────────────────
  test-and-validate:
    name: "🔬 CI — Test & Model Validation"
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set Up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # Step 3: Install all dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      # Step 4: Lint — check for syntax errors
      - name: Lint with Flake8 (Syntax Check)
        run: |
          # Stop the pipeline if there are syntax errors or undefined names
          flake8 app.py scripts/train_model.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings only (style) — won't fail the pipeline
          flake8 app.py --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics

      # Step 5: Train the model
      - name: Train Random Forest Model
        run: |
          python scripts/train_model.py

      # Step 6: Run the full test suite
      - name: Run Pytest Test Suite
        run: |
          pytest tests/test_model.py -v --tb=short --cov=. --cov-report=term-missing

      # Step 7: Upload test artifacts (model + metrics)
      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/random_forest_model.pkl
            models/metrics.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 2: CD — Deploy to AWS EC2 (only on push to main)
  # ─────────────────────────────────────────────────────────────
  deploy-to-ec2:
    name: "🚀 CD — Deploy to AWS EC2"
    runs-on: ubuntu-latest
    needs: test-and-validate          # Only deploys if CI passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Step 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python for pre-deploy prep
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # Step 3: Prepare SSH key for EC2 connection
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # Step 4: Copy project files to EC2 via rsync
      - name: Sync Project Files to EC2
        run: |
          rsync -avz --exclude '.git' --exclude '__pycache__' \
            -e "ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/heart-disease-app/

      # Step 5: SSH into EC2 and install dependencies + retrain + restart
      - name: Deploy & Restart Application on EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'

            set -e
            echo "===== Deployment started at $(date) ====="
            cd ~/heart-disease-app

            # Activate virtual environment (create if needed)
            if [ ! -d "venv" ]; then
              python3 -m venv venv
              echo "Virtual environment created."
            fi
            source venv/bin/activate

            # Install / upgrade dependencies
            pip install --upgrade pip --quiet
            pip install -r requirements.txt --quiet
            echo "✓ Dependencies installed"

            # Retrain the model with latest code
            python scripts/train_model.py
            echo "✓ Model retrained"

            # Restart Streamlit via systemd (zero-downtime)
            sudo systemctl restart heart-disease-app || true
            sleep 3

            # Verify the app is running
            if systemctl is-active --quiet heart-disease-app; then
              echo "✓ Streamlit application is RUNNING"
            else
              echo "✗ Application failed to start — check systemd logs:"
              sudo journalctl -u heart-disease-app -n 30
              exit 1
            fi

            echo "===== Deployment complete at $(date) ====="
          ENDSSH

      # Step 6: Post-deploy health check
      - name: Health Check — Verify App Responds
        run: |
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ secrets.EC2_HOST }}:8501 --max-time 20 || echo "000")
          echo "Health check HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
            echo "✓ Application is responding correctly"
          else
            echo "⚠ App returned status $HTTP_STATUS — may still be starting up"
          fi

      # Step 7: Create GitHub deployment summary
      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Deployed Successfully |" >> $GITHUB_STEP_SUMMARY
          echo "| **Host** | ${{ secrets.EC2_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Port** | 8501 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **App URL:** http://${{ secrets.EC2_HOST }}:8501" >> $GITHUB_STEP_SUMMARY
